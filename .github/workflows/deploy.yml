name: Deploy to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch: # adds a manual "Run workflow" button in the Actions tab

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (CI gate — stops here if this fails)
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Deploy dist/ to Raspberry Pi over SSH
        uses: easingthemes/ssh-deploy@v6.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.PI_HOST }}
          REMOTE_USER: ${{ secrets.PI_USER }}
          REMOTE_PORT: ${{ secrets.PI_PORT }}
          SOURCE: "dist/"
          TARGET: "/var/www/altenovo.com/"
          ARGS: "-rltgoDzvO --delete"
